<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Faculty Allocation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%); min-height: 100vh; }
        .login-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-header { background: linear-gradient(135deg, #1a237e, #3949ab); border-radius: 16px 16px 0 0; }
        .btn-login { background: linear-gradient(135deg, #1a237e, #3949ab); border: none; }
        .btn-login:hover { background: linear-gradient(135deg, #283593, #5c6bc0); }
        .form-control:focus { border-color: #3949ab; box-shadow: 0 0 0 0.2rem rgba(57,73,171,0.25); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <!-- Logo / Title -->
                <div class="text-center mb-4">
                    <i class="fas fa-university fa-3x text-white mb-2"></i>
                    <h4 class="text-white fw-bold">Faculty Allocation &amp;<br>Timetable System</h4>
                </div>

                <!-- Login Card -->
                <div class="card login-card border-0">
                    <div class="login-header text-white text-center py-4">
                        <i class="fas fa-sign-in-alt fa-2x mb-2"></i>
                        <h5 class="mb-0">Sign In</h5>
                    </div>
                    <div class="card-body p-4">

                        <!-- Flash Messages -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% for cat, msg in messages %}
                            <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
                                {{ msg }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                          {% endfor %}
                        {% endwith %}

                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-user me-1 text-primary"></i> Username
                                </label>
                                <input type="text" name="username" class="form-control"
                                       placeholder="Enter username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-lock me-1 text-primary"></i> Password
                                </label>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-login btn-primary w-100 py-2 fw-semibold">
                                <i class="fas fa-arrow-right me-2"></i>Login
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted py-3 bg-light rounded-bottom">
                        <small>
                            <strong>Admin:</strong> admin / admin123 &nbsp;|&nbsp;
                            <strong>Faculty:</strong> faculty1 / faculty123
                        </small>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
